<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Truco</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#27ae60">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="img/logo.png">
</head>

<canvas id="fogos"
    style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;pointer-events:none;"></canvas>

<body>

    <div class="tela-inicio" id="tela-inicio">
        <div class="conteudo-inicio">
            <h1 class="logo-truco">TRUCO!</h1>
            <div class="loading-barra" id="loading-barra">
                <div class="loading-progresso" id="loading-progresso"></div>
            </div>
            <button id="botao-play" style="display:none;">Jogar</button>
        </div>
    </div>


    <main class="contador-container">

        <div class="equipe-container equipe-1">
            <div class="vitorias-container"></div>
            <div class="equipe">
                <h2 class="nome-equipe" contenteditable="true">Nós</h2>
                <p class="placar" id="placar-1">0</p>
                <div class="botoes-ajuste">
                    <button class="botao-ponto" onclick="adicionarPonto(1)">+1</button>
                    <button class="botao-ajustar" onclick="ajustarPlacar(1, -1)">-1</button>
                </div>
            </div>
            <button class="botao-truco" onclick="setPontuacao(1)">Truco!</button>
        </div>

        <div class="equipe-container equipe-2">
            <div class="vitorias-container"></div>
            <div class="equipe">
                <h2 class="nome-equipe" contenteditable="true">Eles</h2>
                <p class="placar" id="placar-2">0</p>
                <div class="botoes-ajuste">
                    <button class="botao-ponto" onclick="adicionarPonto(2)">+1</button>
                    <button class="botao-ajustar" onclick="ajustarPlacar(2, -1)">-1</button>
                </div>
            </div>
            <button class="botao-truco" onclick="setPontuacao(2)">Truco!</button>
        </div>


    </main>

    <div class="botoes-gerais">
        <button class="botao-reiniciar" onclick="reiniciarJogo()">Reiniciar</button>
    </div>

    <div class="tela-vitoria" id="tela-vitoria" style="display: none;">
        <div class="conteudo-vitoria">
            <p id="mensagem-vitoria"></p>
            <button class="botao-nova-partida" onclick="novaPartida()">Nova Partida</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
